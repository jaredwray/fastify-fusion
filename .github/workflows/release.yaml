name: release

on:
  workflow_dispatch:
  release:
    types: [released]

permissions:
  contents: write
  id-token: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - uses: pnpm/action-setup@v6
    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24
        registry-url: 'https://registry.npmjs.org'

    - name: Install Dependencies
      run: pnpm install

    - name: Build
      run: pnpm build

    - name: Testing
      run: pnpm test

    - name: Publish
      run: pnpm publish --provenance --no-git-checks --ignore-scripts
